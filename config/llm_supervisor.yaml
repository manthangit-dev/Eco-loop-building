llm:
  schema_version: 1
  enabled: true
  provider: local_ollama
  endpoint: http://127.0.0.1:11434
  selected_model: qwen3:0.6b
  context_capacity: 8192
  maximum_input_tokens: 4096
  maximum_output_tokens: 512
  maximum_supervisor_iterations: 6
  maximum_tool_calls: 6
  maximum_repeated_tool_calls: 1
  maximum_correction_attempts: 2
  temperature: 0.0
  mock_fixture: module10-v1
  provider_timeout_seconds: 30
  tool_timeout_seconds: 10
  session_timeout_seconds: 90
  maximum_tool_result_characters: 12000
  maximum_conversation_messages: 20
  retry_limit: 1
  prompt_template_version: 1
  supervisor_schema_version: 1
  allowed_classifications: [READ_ONLY, PROPOSAL_ONLY]
  denied_tools: [propose_guarded_control]
  local_only: true
  redact_fields: [token, api_key, password, secret]
  dry_run_only: true
  fail_closed: true
  model_acquisition_limit_gb: 0
storage:
  database: data/output/module_10_llm/llm_audit.db
  output_root: data/output/module_10_llm
